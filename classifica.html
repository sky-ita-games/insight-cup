<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skydo · classifica</title>
<!-- mostrata dentro la slide dall'add-in (addin/manifest.xml); funziona anche aperta nel browser -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  /* palette delle slide del quiz (The Insight Cup), come index.html e host.html */
  :root {
    --bg-1: #0A1655; --bg-2: #0B3BA6; --bg-3: #0A6BD6;
    --panel: rgba(255,255,255,.10); --line: rgba(110,195,255,.6); --line-soft: rgba(255,255,255,.12);
    --cyan: #3FC1F0; --magenta: #E6007E; --coral: #FF5A5F; --muted: rgba(214,228,255,.7); --ok: #3DDC97;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg-2); }
  html, body { height: 100%; overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 100% 0%, rgba(120,175,255,.26) 24vmax, transparent 24.1vmax),
      radial-gradient(circle at 62% 5%, rgba(60,120,220,.7) 3.5vmax, transparent 3.6vmax),
      radial-gradient(circle at 0% 100%, rgba(80,60,200,.55) 20vmax, transparent 20.1vmax),
      radial-gradient(circle at 97% 93%, rgba(85,80,210,.6) 8vmax, transparent 8.1vmax),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  }
  /* tutto in vh: la pagina vive in un riquadro 16:9 di dimensione variabile */
  body {
    display: flex; flex-direction: column; gap: 3vh; padding: 4vh 4.5vh 3vh;
    font-family: 'Sky Text', sans-serif; color: #fff;
  }
  .emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; }
  .eyebrow { font-size: 4.6vh; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--cyan); }
  .logo { font-size: 5.6vh; font-weight: 700; letter-spacing: -.03em; }
  .logo .sky {
    background: linear-gradient(180deg, #FF9F1C 0%, #FF3B30 40%, #E6007E 70%, #7B3FE4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title {
    padding: 1.8vh 3vh; border-radius: 3.6vh; text-align: center;
    background: var(--panel); border: .25vh solid var(--line);
  }
  .title h1 { font-size: 6vh; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
  .title p { font-size: 3.4vh; color: var(--muted); }
  /* podio: 2° - 1° - 3° */
  .podium { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vh; align-items: end; padding: 0 6vh; }
  .spot { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .spot .emoji { font-size: 13vh; line-height: 1.15; }
  .spot .nome { max-width: 100%; font-size: 4.2vh; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spot .punti { font-size: 3.4vh; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; margin-bottom: 1.4vh; }
  .step {
    width: 100%; display: grid; place-items: center; border-radius: 2.4vh 2.4vh 0 0;
    font-size: 9vh; font-weight: 700; box-shadow: 0 1.5vh 4vh rgba(4,10,50,.35);
  }
  .first .step { height: 26vh; background: linear-gradient(180deg, var(--magenta), #B80065); }
  .second .step { height: 18vh; background: linear-gradient(180deg, #2FB4F2, #1288D0); }
  .third .step { height: 12vh; background: linear-gradient(180deg, var(--coral), #E0393F); font-size: 7vh; }
  .first { order: 2; } .second { order: 1; } .third { order: 3; }
  .spot.empty .emoji, .spot.empty .nome, .spot.empty .punti { opacity: .35; }
  .spot.pop .emoji { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  footer { display: flex; justify-content: flex-end; font-size: 2.2vh; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  footer.err { color: var(--coral); }
</style>
</head>
<body>
<header>
  <p class="eyebrow">skydo • classifica</p>
  <p class="logo"><span class="sky">sky</span>do</p>
</header>
<div class="title">
  <h1>Il podio</h1>
  <p id="subtitle">La partita sta per iniziare</p>
</div>
<div class="podium" id="podium"></div>
<footer id="footer">collegamento…</footer>
<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const $ = (id) => document.getElementById(id);
  const PLACES = ["first", "second", "third"];
  let shown = [];  // "emoji nome" per posto, per animare solo chi cambia

  // podio: solo chi ha punti (a inizio partita sono tutti a 0)
  function render(data) {
    const top = (data.top || []).filter((row) => row.punti > 0);
    const players = data.giocatori === 1 ? "1 giocatore" : `${data.giocatori} giocatori`;
    $("subtitle").textContent = !data.n ? `La partita sta per iniziare · ${players}`
      : `Dopo la domanda ${data.n} · ${players}`;
    $("podium").replaceChildren(...PLACES.map((place, i) => {
      const row = top[i];
      const key = row ? `${row.emoji} ${row.nome}` : "";
      const spot = Object.assign(document.createElement("div"), {
        className: `spot ${place}${row ? "" : " empty"}${key && key !== shown[i] ? " pop" : ""}`,
      });
      spot.append(
        Object.assign(document.createElement("span"), { className: "emoji", textContent: row ? row.emoji : "❔" }),
        Object.assign(document.createElement("span"), { className: "nome", textContent: row ? row.nome : "—" }),
        Object.assign(document.createElement("span"), { className: "punti", textContent: row ? `${row.punti} punti` : " " }),
        Object.assign(document.createElement("div"), { className: "step", textContent: i + 1 }),
      );
      return spot;
    }));
    shown = PLACES.map((_, i) => (top[i] ? `${top[i].emoji} ${top[i].nome}` : ""));
  }

  // si aggiorna da sola ogni 3 s; in basso l'ora dell'ultimo aggiornamento (corallo se il server non risponde)
  async function refresh() {
    try {
      const resp = await fetch(`${SERVER}/classifica?id=`);
      if (!resp.ok) throw new Error();
      render(await resp.json());
      $("footer").textContent = `aggiornata alle ${new Date().toLocaleTimeString("it-IT")}`;
      $("footer").className = "";
    } catch {
      $("footer").textContent = "server non raggiungibile, riprovo…";
      $("footer").className = "err";
    }
  }
  render({ n: 0, giocatori: 0, top: [] });
  refresh();
  setInterval(refresh, 3000);
  if (window.Office) Office.onReady(() => {});
</script>
</body>
</html>
