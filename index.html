<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A1655">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>skydo</title>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  /* palette delle slide del quiz (The Insight Cup) */
  :root {
    --bg-1: #0A1655; --bg-2: #0B3BA6; --bg-3: #0A6BD6;
    --panel: rgba(255,255,255,.10); --line: rgba(110,195,255,.6); --line-soft: rgba(255,255,255,.12);
    --cyan: #3FC1F0; --magenta: #E6007E; --magenta-dark: #B80065; --coral: #FF5A5F; --violet: #6B4FE0;
    --tile: #C9DAF2; --navy: #0B1A5E; --text: #FFFFFF; --muted: rgba(214,228,255,.7);
    --ok: #3DDC97; --gold: #FFC24B;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-2); }
  /* sfondo: sfumatura blu notte -> blu con i cerchi delle slide */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 100% 0%, rgba(120,175,255,.26) 24vmax, transparent 24.1vmax),
      radial-gradient(circle at 62% 5%, rgba(60,120,220,.7) 3.5vmax, transparent 3.6vmax),
      radial-gradient(circle at 0% 100%, rgba(80,60,200,.55) 20vmax, transparent 20.1vmax),
      radial-gradient(circle at 97% 93%, rgba(85,80,210,.6) 8vmax, transparent 8.1vmax),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  }
  .card {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(4,10,50,.35);
  }
  /* logo: "sky" con la sfumatura Sky, il resto bianco */
  h1 { font-weight: 700; letter-spacing: -1px; color: var(--text); }
  h1 .sky {
    background: linear-gradient(180deg, #FF9F1C 0%, #FF3B30 40%, #E6007E 70%, #7B3FE4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  input {
    width: 100%; font: inherit; border-radius: 14px; border: 2px solid #4FB3F0;
    background: var(--tile); color: var(--navy); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(63,193,240,.3); }
  input::placeholder { color: rgba(11,26,94,.5); }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 16px; font-family: 'Sky Text', sans-serif; color: var(--text);
  }
  .card { width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 28px; }
  h1 { font-size: 44px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 18px; margin-bottom: 22px; }
  .sub b { color: var(--text); }
  input { font-size: 22px; padding: 16px 18px; }
  button {
    width: 100%; margin-top: 14px; font: inherit; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    padding: 16px; border: none; border-radius: 14px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--magenta), var(--magenta-dark));
    box-shadow: 0 6px 24px rgba(230,0,126,.4); transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .status { min-height: 24px; margin-top: 16px; text-align: center; font-weight: 700; }
  .ok { color: var(--cyan); } .err { color: var(--coral); }
  .link { margin-top: 18px; text-align: center; font-size: 14px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  /* chi sei: emoji (unica nella partita) e nickname */
  .me { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .me .emoji {
    width: 64px; height: 64px; flex: none; display: grid; place-items: center; font-size: 38px;
    border-radius: 16px; background: var(--magenta); box-shadow: 0 6px 20px rgba(230,0,126,.4);
  }
  .me b { display: block; font-size: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me span.hint { color: var(--muted); font-size: 16px; }
  .me > div { min-width: 0; }
  /* le proprie statistiche, al posto della classifica (che sta sulle slide) */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
  .stat { padding: 12px 6px; border-radius: 14px; text-align: center; background: rgba(255,255,255,.08); border: 1px solid var(--line-soft); }
  .stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--cyan); }
  /* round e manche come l'intestazione delle slide, timer come il riquadro TIMER delle slide */
  .qbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: -6px 0 14px; }
  .round { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
  .timer {
    padding: 6px 12px; border-radius: 10px; background: var(--coral); font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  /* opzioni: una per riga, lettera nei colori delle slide + testo (fino a 8 stanno su un telefono) */
  .choices { display: grid; gap: 8px; }
  .choices button {
    margin: 0; min-height: 50px; padding: 8px 14px 8px 8px; display: flex; align-items: center; gap: 12px;
    font-size: 17px; letter-spacing: 0; text-transform: none; text-align: left; line-height: 1.2; border-radius: 14px;
    background: rgba(255,255,255,.1); border: 1.5px solid var(--line); box-shadow: none;
  }
  .choices button b {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; font-size: 18px;
    background: var(--magenta);
  }
  .choices button:nth-child(4n+2) b { background: #1FA6E8; }
  .choices button:nth-child(4n+3) b { background: var(--coral); }
  .choices button:nth-child(4n+4) b { background: var(--violet); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="sky">sky</span>do</h1>

  <div id="join">
    <p class="sub">Scegli un nickname: ti diamo un'emoji tutta tua</p>
    <form id="joinForm">
      <input id="name" maxlength="24" autocomplete="nickname" autocapitalize="words" placeholder="Nickname" required>
      <button>Entra</button>
    </form>
  </div>

  <div id="play" class="hidden">
    <div class="me">
      <span class="emoji" id="emoji"></span>
      <div><b id="who"></b><span class="hint" id="hint"></span></div>
    </div>
    <div class="qbar hidden" id="qbar">
      <span class="round" id="round"></span>
      <span class="timer" id="timer"></span>
    </div>
    <div id="choices" class="choices hidden"></div>
    <form id="answerForm">
      <input id="answer" maxlength="200" autocomplete="off" placeholder="Risposta" required>
      <button id="send">Invia</button>
    </form>
  </div>

  <p class="status" id="status"></p>

  <div id="stats" class="stats hidden">
    <div class="stat"><b id="points">0</b><span>punti</span></div>
    <div class="stat"><b id="rank">–</b><span>posizione</span></div>
    <div class="stat"><b id="right">0</b><span>giuste</span></div>
  </div>
  <p class="link hidden" id="rename">Cambia nickname</p>
</div>

<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let id = store.get("skydo-id");
  if (!id) { id = Math.random().toString(36).slice(2, 10); store.set("skydo-id", id); }
  let name = store.get("skydo-name");
  let emoji = store.get("skydo-emoji") || "";  // assegnata dal server; rimandata per riaverla dopo un reset/riavvio
  let current = { n: 0, scelte: 0, opzioni: [] };  // domanda in corso secondo il server
  // fine del tempo della domanda in corso, in ora del telefono (dai `restanti` del server, così l'orologio del telefono non conta)
  let deadline = null, expired = false, answered = false;

  function status(text, cls) { $("status").textContent = text; $("status").className = "status " + (cls || ""); }

  function setEmoji(value) {
    if (!value) return;
    emoji = value;
    store.set("skydo-emoji", emoji);
    $("emoji").textContent = emoji;
  }

  // risponde {ok, error, domanda, emoji}; error = full | not_started | timeout | already_answered | stale | network
  async function publish(payload, who = name) {
    try {
      const resp = await fetch(SERVER + "/msg", { method: "POST", body: JSON.stringify({ id, name: who, emoji, ...payload }) });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok) setEmoji(data.emoji);
      return resp.ok ? { ok: true, ...data } : { ok: false, error: data.error || "network", ...data };
    } catch { return { ok: false, error: "network" }; }
  }

  // solo le proprie statistiche: la classifica la mostra il conduttore sulle slide
  async function refreshStats() {
    if ($("play").classList.contains("hidden")) return;
    let data;
    try { data = await (await fetch(`${SERVER}/classifica?id=${encodeURIComponent(id)}`)).json(); } catch { return; }
    $("stats").classList.toggle("hidden", !data.n);
    if (data.n !== current.n || data.scelte !== current.scelte) setQuestion(data);
    syncTimer(data);
    if (!data.me) return;
    setEmoji(data.me.emoji);
    $("points").textContent = data.me.punti;
    $("rank").textContent = data.me.punti ? `${data.me.pos}°` : "–";
    $("right").textContent = `${data.me.giuste}/${data.n}`;
  }

  // "Round 2 • Manche 1" dai campi round/manche di quiz.json
  const roundLabel = (question) => [question.round && `Round ${question.round}`, question.manche && `Manche ${question.manche}`]
    .filter(Boolean).join(" • ");

  // domanda a scelta multipla: un pulsante per opzione (lettera + testo, si invia la lettera); altrimenti campo di testo
  function setQuestion(question) {
    const { n = 0, scelte = 0 } = question;
    const options = question.opzioni || [];
    const changed = n !== current.n;
    current = { n, scelte, opzioni: options };
    if (changed) { deadline = null; expired = false; answered = false; }
    if (changed && n) status("");
    $("round").textContent = n ? roundLabel(question) : "";
    syncTimer(question);
    $("choices").replaceChildren(...Array.from({ length: scelte }, (_, i) => {
      const letter = String.fromCharCode(65 + i);
      const button = document.createElement("button");
      button.append(Object.assign(document.createElement("b"), { textContent: letter }),
                    Object.assign(document.createElement("span"), { textContent: options[i] || "" }));
      button.onclick = () => send(letter, options[i] || letter);
      return button;
    }));
    showInputs();
  }

  // pulsanti o campo di testo finché c'è tempo; scaduto il tempo spariscono entrambi
  function showInputs() {
    const { n, scelte } = current;
    $("hint").textContent = !n ? "aspetta la prima domanda" : expired ? "tempo scaduto, aspetta la prossima"
      : scelte ? "scegli la risposta!" : "scrivi la risposta!";
    $("answerForm").classList.toggle("hidden", !!scelte || expired);
    $("choices").classList.toggle("hidden", !scelte || expired);
  }

  function syncTimer(data) {
    if (data.n === current.n && data.restanti != null) deadline = Date.now() + data.restanti * 1000;
  }

  function expire() {
    if (expired) return;
    expired = true;
    showInputs();
    if (!answered) status("Tempo scaduto", "err");
  }

  // "TIMER • 00:42" come sulle slide; a zero il telefono smette di accettare risposte (il server le rifiuta comunque)
  setInterval(() => {
    const running = current.n && deadline !== null;
    $("qbar").classList.toggle("hidden", !current.n);
    $("timer").classList.toggle("hidden", !running);
    if (!running) return;
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $("timer").textContent = `timer • ${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    if (!left) expire();
  }, 250);

  function showJoin(message) {
    $("play").classList.add("hidden");
    $("stats").classList.add("hidden");
    $("rename").classList.add("hidden");
    $("join").classList.remove("hidden");
    $("name").value = name || "";
    $("name").focus();
    status(message || "", "err");
  }

  function showPlay() {
    $("join").classList.add("hidden");
    $("play").classList.remove("hidden");
    $("rename").classList.remove("hidden");
    $("who").textContent = name;
    $("emoji").textContent = emoji;
    setQuestion(current);
    refreshStats();
    $("answer").focus();
  }

  const FULL = "La partita è al completo";

  $("joinForm").onsubmit = async (e) => {
    e.preventDefault();
    const candidate = $("name").value.trim().split(/\s+/).join(" ");
    if (!candidate) return;
    status("Entro…");
    const result = await publish({ type: "join" }, candidate);
    if (!result.ok) return status(result.error === "full" ? FULL : "Connessione non riuscita, riprova", "err");
    name = candidate;
    store.set("skydo-name", name);
    status("");
    showPlay();
  };

  $("answerForm").onsubmit = (e) => {
    e.preventDefault();
    const answer = $("answer").value.trim();
    if (answer) send(answer);
  };

  // label = cosa mostrare nella conferma (il testo dell'opzione, non la lettera)
  async function send(answer, label = answer) {
    const buttons = [$("send"), ...$("choices").children];
    buttons.forEach((button) => { button.disabled = true; });
    status("Invio…");
    const result = await publish({ type: "answer", answer, domanda: current.n || undefined });
    buttons.forEach((button) => { button.disabled = false; });
    if (result.ok) {
      answered = true;
      $("answer").value = "";
      status(`Risposta inviata: ${label}`, "ok");
      refreshStats();
    } else if (result.error === "already_answered") {
      answered = true;
      status("Hai già risposto a questa domanda", "err");
    } else if (result.error === "timeout") {
      expire();
      status("Tempo scaduto: risposta non accettata", "err");
    } else if (result.error === "stale") {
      await refreshStats();
      status("È partita una nuova domanda: rispondi a questa", "err");
    } else if (result.error === "not_started") {
      status("La domanda non è ancora partita, aspetta il via", "err");
    } else if (result.error === "full") {
      status(FULL, "err");
    } else {
      status("Invio non riuscito, riprova", "err");
    }
    if (!current.scelte && !expired) $("answer").focus();
  }

  $("rename").onclick = () => showJoin();
  setInterval(refreshStats, 3000);

  // il server risponde appena parte un'altra domanda (long-polling), così pulsanti e campo cambiano subito al via
  // ogni attesa si chiude comunque dopo 35 s (il server risponde entro 25): col telefono bloccato la connessione
  // può morire senza errore, e senza timeout il telefono resterebbe fermo sulla domanda vecchia
  let waitAbort = null;
  (async function waitQuestion() {
    for (;;) {
      waitAbort = new AbortController();
      const timer = setTimeout(() => waitAbort.abort(), 35000);
      try {
        const data = await (await fetch(`${SERVER}/attesa?n=${current.n}`, { signal: waitAbort.signal })).json();
        if (data.n !== current.n || data.scelte !== current.scelte) setQuestion(data);
        syncTimer(data);
      } catch { await new Promise((resolve) => setTimeout(resolve, 1000)); }
      clearTimeout(timer);
    }
  })();

  // al risveglio del telefono: domanda e classifica subito, e si riapre un'attesa nuova
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    refreshStats();
    if (waitAbort) waitAbort.abort();
  });

  if (name) {
    showPlay();
    publish({ type: "join" });  // si ripresenta al conduttore (es. dopo un reset), con la stessa emoji se è libera
  }
</script>
</body>
</html>
