<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A1655">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>skydo</title>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  /* palette delle slide del quiz (The Insight Cup) */
  :root {
    --bg-1: #0A1655; --bg-2: #0B3BA6; --bg-3: #0A6BD6;
    --panel: rgba(255,255,255,.10); --line: rgba(110,195,255,.6); --line-soft: rgba(255,255,255,.12);
    --cyan: #3FC1F0; --magenta: #E6007E; --magenta-dark: #B80065; --coral: #FF5A5F; --violet: #6B4FE0;
    --tile: #C9DAF2; --navy: #0B1A5E; --text: #FFFFFF; --muted: rgba(214,228,255,.7);
    --ok: #3DDC97; --gold: #FFC24B;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-2); }
  /* sfondo: sfumatura blu notte -> blu con i cerchi delle slide */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 100% 0%, rgba(120,175,255,.26) 24vmax, transparent 24.1vmax),
      radial-gradient(circle at 62% 5%, rgba(60,120,220,.7) 3.5vmax, transparent 3.6vmax),
      radial-gradient(circle at 0% 100%, rgba(80,60,200,.55) 20vmax, transparent 20.1vmax),
      radial-gradient(circle at 97% 93%, rgba(85,80,210,.6) 8vmax, transparent 8.1vmax),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  }
  .card {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(4,10,50,.35);
  }
  /* logo: "sky" con la sfumatura Sky, il resto bianco */
  h1 { font-weight: 700; letter-spacing: -1px; color: var(--text); }
  h1 .sky {
    background: linear-gradient(180deg, #FF9F1C 0%, #FF3B30 40%, #E6007E 70%, #7B3FE4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  input {
    width: 100%; font: inherit; border-radius: 14px; border: 2px solid #4FB3F0;
    background: var(--tile); color: var(--navy); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(63,193,240,.3); }
  input::placeholder { color: rgba(11,26,94,.5); }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 16px; font-family: 'Sky Text', sans-serif; color: var(--text);
  }
  .card { width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 28px; }
  h1 { font-size: 44px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 18px; margin-bottom: 22px; }
  .sub b { color: var(--text); }
  input { font-size: 22px; padding: 16px 18px; }
  button {
    width: 100%; margin-top: 14px; font: inherit; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    padding: 16px; border: none; border-radius: 14px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--magenta), var(--magenta-dark));
    box-shadow: 0 6px 24px rgba(230,0,126,.4); transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .status { min-height: 24px; margin-top: 16px; text-align: center; font-weight: 700; }
  .ok { color: var(--cyan); } .err { color: var(--coral); }
  .link { margin-top: 18px; text-align: center; font-size: 14px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .board { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .board h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--cyan); margin-bottom: 8px; }
  .board ol { list-style: none; padding: 0; }
  .board li { display: flex; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: 17px; }
  .board li .pos { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .board li .nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board li .punti { font-weight: 700; font-variant-numeric: tabular-nums; }
  .board li.me { background: var(--magenta); font-weight: 700; box-shadow: 0 4px 16px rgba(230,0,126,.35); }
  .board li.me .pos { color: #fff; }
  .board li.gap { justify-content: center; color: var(--muted); padding: 0; }
  /* pulsanti A/B/C/D con i colori delle slide */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choices button { margin: 0; padding: 0; aspect-ratio: 1.4; font-size: 44px; letter-spacing: 0; border-radius: 18px; }
  .choices button:nth-child(2) { background: linear-gradient(135deg, #2FB4F2, #1288D0); box-shadow: 0 6px 24px rgba(47,180,242,.35); }
  .choices button:nth-child(3) { background: linear-gradient(135deg, var(--coral), #E0393F); box-shadow: 0 6px 24px rgba(255,90,95,.35); }
  .choices button:nth-child(4) { background: linear-gradient(135deg, var(--violet), #4F34C4); box-shadow: 0 6px 24px rgba(107,79,224,.35); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="sky">sky</span>do</h1>

  <div id="join">
    <p class="sub">Inserisci nome e cognome</p>
    <form id="joinForm">
      <input id="name" maxlength="40" autocomplete="name" autocapitalize="words" placeholder="Nome e cognome" required>
      <button>Entra</button>
    </form>
  </div>

  <div id="play" class="hidden">
    <p class="sub">Ciao <b id="who"></b>, <span id="hint">scrivi la risposta!</span></p>
    <div id="choices" class="choices hidden"></div>
    <form id="answerForm">
      <input id="answer" maxlength="200" autocomplete="off" placeholder="Risposta" required>
      <button id="send">Invia</button>
    </form>
  </div>

  <p class="status" id="status"></p>

  <div id="board" class="board hidden">
    <h2>Classifica</h2>
    <ol id="boardList"></ol>
  </div>
  <p class="link hidden" id="rename">Non sei tu? Cambia nome</p>
</div>

<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let id = store.get("skydo-id");
  if (!id) { id = Math.random().toString(36).slice(2, 10); store.set("skydo-id", id); }
  let name = store.get("skydo-name");
  let current = { n: 0, scelte: 0 };  // domanda in corso secondo il server

  function status(text, cls) { $("status").textContent = text; $("status").className = "status " + (cls || ""); }

  // risponde {ok, error, domanda}; error = name_taken | not_started | already_answered | network
  async function publish(payload, who = name) {
    try {
      const resp = await fetch(SERVER + "/msg", { method: "POST", body: JSON.stringify({ id, name: who, ...payload }) });
      const data = await resp.json().catch(() => ({}));
      return resp.ok ? { ok: true, ...data } : { ok: false, error: data.error || "network", ...data };
    } catch { return { ok: false, error: "network" }; }
  }

  // classifica: primi 5, poi "…" e la propria posizione se più in basso
  async function refreshBoard() {
    if ($("play").classList.contains("hidden")) return;
    let data;
    try { data = await (await fetch(`${SERVER}/classifica?id=${encodeURIComponent(id)}`)).json(); } catch { return; }
    $("board").classList.toggle("hidden", !data.n);
    if (data.n !== current.n || data.scelte !== current.scelte) setQuestion(data.n, data.scelte);
    const rows = [...data.top];
    if (data.me && data.me.pos > rows.length) {
      if (data.me.pos > rows.length + 1) rows.push(null);
      rows.push(data.me);
    }
    $("boardList").replaceChildren(...rows.map((row) => {
      const item = document.createElement("li");
      if (!row) { item.className = "gap"; item.textContent = "⋮"; return item; }
      if (data.me && row.pos === data.me.pos) item.className = "me";
      [["pos", row.pos + "."], ["nome", row.nome], ["punti", row.punti]].forEach(([cls, text]) =>
        item.appendChild(Object.assign(document.createElement("span"), { className: cls, textContent: text })));
      return item;
    }));
  }

  // domanda a scelta multipla: pulsanti A, B, C...; altrimenti campo di testo
  function setQuestion(n, scelte) {
    const changed = n !== current.n;
    current = { n, scelte };
    if (changed && n) status("");
    $("hint").textContent = scelte ? "scegli la risposta!" : "scrivi la risposta!";
    $("answerForm").classList.toggle("hidden", !!scelte);
    $("choices").classList.toggle("hidden", !scelte);
    $("choices").replaceChildren(...Array.from({ length: scelte }, (_, i) => {
      const button = document.createElement("button");
      button.textContent = String.fromCharCode(65 + i);
      button.onclick = () => send(button.textContent);
      return button;
    }));
  }

  function showJoin(message) {
    $("play").classList.add("hidden");
    $("board").classList.add("hidden");
    $("rename").classList.add("hidden");
    $("join").classList.remove("hidden");
    $("name").value = name || "";
    $("name").focus();
    status(message || "", "err");
  }

  function showPlay() {
    $("join").classList.add("hidden");
    $("play").classList.remove("hidden");
    $("rename").classList.remove("hidden");
    $("who").textContent = name;
    refreshBoard();
    $("answer").focus();
  }

  const NAME_TAKEN = "Questo nome e cognome è già usato da un altro giocatore";
  const FULL_NAME = "Scrivi nome e cognome";
  const isFullName = (text) => (text || "").trim().split(/\s+/).length >= 2;

  $("joinForm").onsubmit = async (e) => {
    e.preventDefault();
    const candidate = $("name").value.trim().split(/\s+/).join(" ");
    if (!candidate) return;
    if (!isFullName(candidate)) return status(FULL_NAME, "err");
    status("Entro…");
    const result = await publish({ type: "join" }, candidate);
    if (!result.ok) {
      const errors = { name_taken: NAME_TAKEN, full_name: FULL_NAME };
      return status(errors[result.error] || "Connessione non riuscita, riprova", "err");
    }
    name = candidate;
    store.set("skydo-name", name);
    status("");
    showPlay();
  };

  $("answerForm").onsubmit = (e) => {
    e.preventDefault();
    const answer = $("answer").value.trim();
    if (answer) send(answer);
  };

  async function send(answer) {
    const buttons = [$("send"), ...$("choices").children];
    buttons.forEach((button) => { button.disabled = true; });
    status("Invio…");
    const result = await publish({ type: "answer", answer, domanda: current.n || undefined });
    buttons.forEach((button) => { button.disabled = false; });
    if (result.ok) {
      $("answer").value = "";
      status(`Risposta alla domanda ${result.domanda} inviata: ${answer}`, "ok");
      refreshBoard();
    } else if (result.error === "already_answered") {
      status(`Hai già risposto alla domanda ${result.domanda}`, "err");
    } else if (result.error === "stale") {
      await refreshBoard();
      status(`È partita la domanda ${result.domanda}: rispondi a questa`, "err");
    } else if (result.error === "not_started") {
      status("La domanda non è ancora partita, aspetta il via", "err");
    } else if (result.error === "name_taken" || result.error === "full_name") {
      showJoin(result.error === "name_taken" ? NAME_TAKEN : FULL_NAME);
    } else {
      status("Invio non riuscito, riprova", "err");
    }
    if (!current.scelte) $("answer").focus();
  }

  $("rename").onclick = () => showJoin();
  setInterval(refreshBoard, 3000);

  // il server risponde appena parte un'altra domanda (long-polling), così pulsanti e campo cambiano subito al via
  // ogni attesa si chiude comunque dopo 35 s (il server risponde entro 25): col telefono bloccato la connessione
  // può morire senza errore, e senza timeout il telefono resterebbe fermo sulla domanda vecchia
  let waitAbort = null;
  (async function waitQuestion() {
    for (;;) {
      waitAbort = new AbortController();
      const timer = setTimeout(() => waitAbort.abort(), 35000);
      try {
        const data = await (await fetch(`${SERVER}/attesa?n=${current.n}`, { signal: waitAbort.signal })).json();
        if (data.n !== current.n || data.scelte !== current.scelte) setQuestion(data.n, data.scelte);
      } catch { await new Promise((resolve) => setTimeout(resolve, 1000)); }
      clearTimeout(timer);
    }
  })();

  // al risveglio del telefono: domanda e classifica subito, e si riapre un'attesa nuova
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    refreshBoard();
    if (waitAbort) waitAbort.abort();
  });

  if (name && !isFullName(name)) {
    showJoin(FULL_NAME);  // nome salvato da una versione precedente, senza cognome
  } else if (name) {
    showPlay();
    // si ripresenta al conduttore (es. dopo un reset); se nel frattempo il nome è stato preso, ne chiede un altro
    publish({ type: "join" }).then((result) => { if (result.error === "name_taken") showJoin(NAME_TAKEN); });
  }
</script>
</body>
</html>
