<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A1655">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Insight Cup · conduttore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  /* palette delle slide del quiz (The Insight Cup) */
  :root {
    --bg-1: #0A1655; --bg-2: #0B3BA6; --bg-3: #0A6BD6;
    --panel: rgba(255,255,255,.10); --line: rgba(110,195,255,.6); --line-soft: rgba(255,255,255,.12);
    --cyan: #3FC1F0; --magenta: #E6007E; --magenta-dark: #B80065; --coral: #FF5A5F; --violet: #6B4FE0;
    --tile: #C9DAF2; --navy: #0B1A5E; --text: #FFFFFF; --muted: rgba(214,228,255,.7);
    --ok: #3DDC97; --gold: #FFC24B;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-2); }
  /* sfondo: sfumatura blu notte -> blu con i cerchi delle slide */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 100% 0%, rgba(120,175,255,.26) 24vmax, transparent 24.1vmax),
      radial-gradient(circle at 62% 5%, rgba(60,120,220,.7) 3.5vmax, transparent 3.6vmax),
      radial-gradient(circle at 0% 100%, rgba(80,60,200,.55) 20vmax, transparent 20.1vmax),
      radial-gradient(circle at 97% 93%, rgba(85,80,210,.6) 8vmax, transparent 8.1vmax),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  }
  .card {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(4,10,50,.35);
  }
  /* logo: "sky" con la sfumatura Sky, il resto bianco */
  h1 { font-weight: 700; letter-spacing: -1px; color: var(--text); }
  h1 .sky {
    background: linear-gradient(180deg, #FF9F1C 0%, #FF3B30 40%, #E6007E 70%, #7B3FE4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  input {
    width: 100%; font: inherit; border-radius: 14px; border: 2px solid #4FB3F0;
    background: var(--tile); color: var(--navy); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(63,193,240,.3); }
  input::placeholder { color: rgba(11,26,94,.5); }
  body { min-height: 100dvh; padding: 16px; font-family: 'Sky Text', sans-serif; color: var(--text); }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card { padding: 22px; border-radius: 26px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 4px 0; }
  h1 { font-size: 34px; }
  h1 small { margin-left: 6px; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--cyan); margin-bottom: 12px; }
  .muted { color: var(--muted); }
  .server { font-size: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 50px; background: rgba(255,255,255,.08); }
  .server::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
  .server.ok::before { background: var(--ok); box-shadow: 0 0 0 4px rgba(61,220,151,.2); animation: none; }
  .server.down { color: var(--coral); font-weight: 700; background: rgba(255,90,95,.15); cursor: pointer; }
  .server.down::before { background: var(--coral); }
  .server a { color: inherit; }
  @keyframes pulse { 50% { opacity: .3; } }
  input[type=password] { font-size: 20px; padding: 14px 16px; }
  button {
    font: inherit; font-weight: 700; border: 1px solid var(--line-soft); border-radius: 12px; cursor: pointer;
    padding: 12px 20px; font-size: 16px; color: var(--text); background: rgba(255,255,255,.1);
    transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.main {
    width: 100%; padding: 20px; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: #fff; border: none;
    background: linear-gradient(135deg, var(--magenta), var(--magenta-dark)); box-shadow: 0 6px 24px rgba(230,0,126,.4);
  }
  button.danger { color: #fff; background: var(--coral); border-color: transparent; }
  #game { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar button { padding: 10px 18px; font-size: 15px; }
  .stats { display: flex; gap: 24px; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat b { font-size: 30px; font-variant-numeric: tabular-nums; }
  .stat.ending b { color: var(--coral); }
  .stat span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--cyan); }
  .round { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); }
  .round:empty { display: none; }
  .round:not(:empty) + .question { margin-top: 6px; padding-top: 0; border-top: none; }
  .question { white-space: pre-wrap; font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
  .question.idle { font-weight: 400; color: var(--muted); font-size: 18px; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 14px; background: rgba(255,255,255,.08); }
  .tabs button { padding: 8px 18px; font-size: 15px; background: transparent; border-color: transparent; border-radius: 10px; }
  .tabs button.active { background: #fff; color: var(--navy); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 16px; }
  td, th { padding: 10px 8px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line-soft); }
  th { font-size: 12px; color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  tbody tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .answer { overflow-wrap: anywhere; }
  .mark { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  tr.yes .mark { background: var(--ok); }
  tr.no .mark { background: var(--coral); opacity: .7; }
  tr.no td:not(:first-child) { color: var(--muted); }
  tr.first td { font-weight: 700; background: rgba(255,194,75,.12); }
  .badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
    letter-spacing: .5px; color: var(--navy); background: var(--gold); vertical-align: 2px; }
  .pos { color: var(--muted); font-weight: 700; }
  tr.podium .pos { color: var(--cyan); }
  tr.podium:first-child td { font-weight: 700; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  /* larghezze colonne (table-layout fixed: la colonna senza larghezza prende il resto) */
  .c-mark { width: 34px; } .c-pos { width: 44px; } .c-live-name { width: 38%; }
  .c-sec { width: 64px; } .c-pts { width: 76px; } .c-ok { width: 72px; }
  @media (max-width: 560px) {
    .card { padding: 18px 16px; }
      td, th { padding: 10px 5px; } td { font-size: 15px; }
    .c-mark { width: 20px; } .c-pos { width: 30px; } .c-live-name { width: 44%; } .c-pts { width: 54px; } .c-ok { width: 56px; }
    .hide-sm { display: none; }
  }
  .error { color: var(--coral); font-weight: 700; min-height: 1em; margin-top: 10px; }
  .hidden { display: none !important; }
  /* QR su fondo bianco, per la leggibilità della fotocamera */
  #qrModal {
    position: fixed; inset: 0; background: rgba(5,10,40,.7); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #qrModal .card { background: #fff; color: var(--navy); border-color: #fff; text-align: center; max-width: 520px; width: 100%; }
  #qrModal h2 { color: var(--magenta); }
  #qrModal button { color: var(--navy); background: rgba(11,26,94,.08); border-color: transparent; }
  #qrCanvas { width: 100%; max-width: 420px; height: auto; }
  #qrUrl { word-break: break-all; font-size: 14px; margin: 10px 0 16px; color: #5A6A9A; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="sky">sky</span> insight cup <small>conduttore</small></h1>
    <span class="server muted" id="serverStatus" title="Tocca per riprovare">Sveglio il server…</span>
  </header>

  <!-- Accesso -->
  <section class="card hidden" id="login">
    <h2>Accesso conduttore</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Chiave (HOST_KEY)" autocomplete="current-password" required>
      <div style="margin-top:14px"><button class="main">Entra</button></div>
    </form>
    <p class="error" id="loginError"></p>
  </section>

  <!-- Partita -->
  <section class="hidden" id="game">
    <div class="card">
      <div class="toolbar">
        <div class="stats">
          <div class="stat"><b id="playersStat">0</b><span id="playersLabel">giocatori</span></div>
          <div class="stat"><b id="questionStat">0/0</b><span>domanda</span></div>
          <div class="stat" id="timerBox"><b id="timerStat">–</b><span id="timerLabel">tempo</span></div>
        </div>
        <div class="row">
          <button id="showQr">QR</button>
          <button id="podium">Podio</button>
          <button id="xlsx">Excel</button>
          <button class="danger" id="reset">Reset</button>
        </div>
      </div>
      <p class="round" id="roundText"></p>
      <p class="question" id="questionText"></p>
      <p class="error" id="gameError"></p>
      <div style="margin-top:14px"><button class="main" id="next" disabled>Avvia domanda 1</button></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="active" data-tab="live">Live</button>
        <button data-tab="board">Classifica</button>
      </div>
      <div id="live"></div>
      <div id="board" class="hidden"></div>
    </div>
  </section>
</main>

<div id="qrModal" class="hidden">
  <div class="card">
    <h2>Inquadra per giocare</h2>
    <canvas id="qrCanvas"></canvas>
    <p id="qrUrl" class="muted"></p>
    <div class="row" style="justify-content:center">
      <button id="qrDownload">Scarica PNG</button>
      <button id="qrClose">Chiudi</button>
    </div>
  </div>
</div>

<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const PLAYER_URL = new URL("./", location.href).href;  // index.html, stessa cartella
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  let key = store.get("skydo-host-key");
  let quiz = [];
  let state = freshState();
  let epoch = null;
  let boot = null;  // cambia solo se il server si riavvia (un reset cambia solo epoch)
  let pollBusy = false;
  let deadline = null;  // fine del tempo della domanda in corso

  // timer della domanda (solo qui: sui telefoni no, c'è quello della slide); corallo negli ultimi 10 s
  setInterval(() => {
    const left = deadline === null ? null : Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $("timerStat").textContent = left === null ? "–" : `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timerLabel").textContent = left === 0 ? "scaduto" : "tempo";
    $("timerBox").classList.toggle("ending", left !== null && left <= 10);
  }, 250);

  function freshState() {
    return { since: 0, n: 0, players: {}, answers: [] };
  }

  // ---------- server ----------
  async function post(path, body) {
    const resp = await fetch(SERVER + path, { method: "POST", body: JSON.stringify(body) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw Object.assign(new Error(data.error || "errore " + resp.status), { status: resp.status });
    return data;
  }

  // stato del server in alto a destra: grigio = si sta svegliando, verde = risponde, rosso = non risponde da DOWN_AFTER ms
  const DOWN_AFTER = 3000;
  let lastOk = 0, waking = false;

  function serverStatus(kind, text) {
    const element = $("serverStatus");
    element.className = "server " + (kind === "waking" ? "muted" : kind);
    element.textContent = text;
    if (kind === "down") {
      const link = Object.assign(document.createElement("a"), { href: "https://dashboard.render.com/", target: "_blank", textContent: "Render" });
      link.onclick = (e) => e.stopPropagation();
      element.append(" · ", link);
    }
  }

  function serverOk() {
    lastOk = Date.now();
    serverStatus("ok", "server pronto");
  }

  function serverFailed() {
    if (!waking && Date.now() - lastOk > DOWN_AFTER) serverStatus("down", "server non raggiungibile · tocca per svegliarlo");
  }

  // Render free si accende da solo alla prima richiesta (~1 min): qui si insiste per 2,5 min mostrando l'attesa
  async function wakeServer() {
    if (waking) return false;
    waking = true;
    const start = Date.now();
    while (Date.now() - start < 150000) {
      try {
        if ((await fetch(SERVER + "/")).ok) { waking = false; serverOk(); return true; }
      } catch {}
      serverStatus("waking", `Sveglio il server… ${Math.round((Date.now() - start) / 1000)}s`);
      await new Promise((resolve) => setTimeout(resolve, 3000));
    }
    waking = false;
    serverStatus("down", "server spento · tocca per riprovare o riavvialo da");
    return false;
  }

  $("serverStatus").onclick = () => { if ($("serverStatus").classList.contains("down")) wakeServer(); };

  async function poll() {
    if (pollBusy || !key) return;
    pollBusy = true;
    try {
      const resp = await fetch(`${SERVER}/msg?since=${state.since}&key=${encodeURIComponent(key)}`);
      if (resp.status === 403) { logout("Chiave non più valida"); return; }
      if (!resp.ok) { serverFailed(); return; }
      const data = await resp.json();
      serverOk();
      if (epoch !== null && data.epoch !== epoch && boot !== null && data.boot === boot) {
        // reset premuto da un'altra pagina del conduttore: si riparte da zero anche qui, senza rimandare domande
        state = freshState();
        $("gameError").textContent = "Partita azzerata da un'altra pagina del conduttore.";
        loadQuiz();
      } else if (epoch !== null && data.epoch !== epoch) {
        // server riavviato: la numerazione riparte, la partita in corso resta
        state.since = 0;
        $("gameError").textContent = "Il server si è riavviato: ho ripreso la domanda in corso, le risposte già ricevute restano.";
        loadQuiz();
        // il server riparte senza domanda: la rimando, così i telefoni tornano subito ai pulsanti giusti
        if (state.n) post("/question", { key, n: state.n }).catch(() => {});
      }
      epoch = data.epoch;
      boot = data.boot;
      // fine del tempo in ora di questo browser, dai secondi rimasti secondo il server
      deadline = data.restanti == null ? null : Date.now() + data.restanti * 1000;
      data.messages.forEach(handle);
      if (data.messages.length) render();
    } catch { serverFailed(); } finally { pollBusy = false; }
  }

  function handle(event) {
    if (event.seq <= state.since) return;
    state.since = event.seq;
    let payload;
    try { payload = JSON.parse(event.message); } catch { return; }
    if (payload.type === "question") { state.n = payload.domanda || state.n + 1; return; }
    const id = String(payload.id || "?");
    state.players[id] = { nome: String(payload.name || "?"), emoji: String(payload.emoji || "") };
    if (payload.type !== "answer") return;
    // dopo un riavvio il server dimentica chi ha già risposto: qui vale sempre la prima risposta e il primo 1°
    const same = state.answers.filter((answer) => answer.domanda === payload.domanda);
    if (same.some((answer) => answer.id === id)) return;
    if (same.some((answer) => answer.primo)) payload.primo = false;
    // correttezza, secondi e punti li calcola il server (stessi numeri che vedono i telefoni)
    state.answers.push({
      domanda: payload.domanda, risposta: payload.answer, corretta: payload.corretta,
      secondi: Number(payload.secondi) || 0, punti: Number(payload.punti) || 0, primo: !!payload.primo, ts: new Date(event.time * 1000).toISOString(), id,
    });
  }

  // ---------- render ----------
  // columns: [{label, cls, col}], col = classe CSS della larghezza; ogni cella è testo o un nodo DOM, con la classe della sua colonna
  function table(columns, rows, emptyText) {
    if (!rows.length) return Object.assign(document.createElement("p"), { className: "empty", textContent: emptyText });
    const element = document.createElement("table");
    const colgroup = element.appendChild(document.createElement("colgroup"));
    columns.forEach(({ col, cls }) => { colgroup.appendChild(document.createElement("col")).className = [col, (cls || "").includes("hide-sm") ? "hide-sm" : ""].join(" "); });
    const head = element.createTHead().insertRow();
    columns.forEach(({ label, cls }) => head.appendChild(Object.assign(document.createElement("th"), { textContent: label, className: cls || "" })));
    const body = element.createTBody();
    rows.forEach(({ cells, cls }) => {
      const row = body.insertRow();
      if (cls) row.className = cls;
      cells.forEach((content, i) => {
        const td = row.insertCell();
        td.className = columns[i].cls || "";
        if (content instanceof Node) td.appendChild(content); else td.textContent = content;
      });
    });
    return element;
  }

  // giocatore = emoji (unica nella partita) + nickname; nome e emoji sempre gli ultimi ricevuti
  const playerName = (id) => { const player = state.players[id] || {}; return `${player.emoji || ""} ${player.nome || "?"}`.trim(); };

  function nameCell(name, first) {
    const span = Object.assign(document.createElement("span"), { textContent: name });
    if (first) span.appendChild(Object.assign(document.createElement("span"), { className: "badge", textContent: "1°" }));
    return span;
  }

  function leaderboard() {
    const scores = {};
    Object.entries(state.players).forEach(([id, { nome, emoji }]) => { scores[id] = { nome, emoji, punti: 0, giuste: 0, secondi: 0 }; });
    state.answers.filter((answer) => answer.corretta).forEach((answer) => {
      const score = scores[answer.id];
      score.punti += answer.punti;
      score.giuste += 1;
      score.secondi += answer.secondi;
    });
    return Object.values(scores).sort((a, b) => b.punti - a.punti || a.secondi - b.secondi);
  }

  // "B" -> "B · 2003" per le domande a scelta multipla
  function optionLabel(answer) {
    const options = (quiz[answer.domanda - 1] || {}).opzioni || [];
    const index = String(answer.risposta || "").trim().toUpperCase().charCodeAt(0) - 65;
    return String(answer.risposta).trim().length === 1 && options[index] ? `${answer.risposta} · ${options[index]}` : answer.risposta;
  }

  function render() {
    const total = quiz.length;
    const players = Object.keys(state.players).length;
    $("playersStat").textContent = players;
    $("playersLabel").textContent = players === 1 ? "giocatore" : "giocatori";
    $("questionStat").textContent = `${state.n}/${total}`;
    $("questionText").textContent = state.n
      ? (quiz[state.n - 1] || {}).domanda || ""
      : "Mostra il QR e aspetta che i giocatori entrino.";
    $("questionText").classList.toggle("idle", !state.n);
    const now = quiz[state.n - 1] || {};
    $("roundText").textContent = [now.round && `Round ${now.round}`, now.manche && `Manche ${now.manche}`].filter(Boolean).join(" • ");
    const next = $("next");
    if (!next.dataset.busy) {
      next.disabled = state.n >= total;
      next.textContent = state.n >= total ? "Domande finite" : `Avvia domanda ${state.n + 1}`;
    }

    const current = state.answers.filter((answer) => answer.domanda === state.n);
    $("live").replaceChildren(table([
      { label: "", col: "c-mark" }, { label: "Nome", cls: "name", col: "c-live-name" }, { label: "Risposta", cls: "answer" },
      { label: "Sec", cls: "num hide-sm", col: "c-sec" }, { label: "Punti", cls: "num", col: "c-pts" },
    ], current.map((answer) => ({
      cls: (answer.corretta ? "yes" : "no") + (answer.primo ? " first" : ""),
      cells: [Object.assign(document.createElement("span"), { className: "mark" }), nameCell(playerName(answer.id), answer.primo),
              optionLabel(answer), answer.secondi.toFixed(1), answer.punti],
    })), state.n ? "Ancora nessuna risposta a questa domanda." : "Le risposte appariranno qui."));

    $("board").replaceChildren(table([
      { label: "#", cls: "pos", col: "c-pos" }, { label: "Nome", cls: "name" }, { label: "Punti", cls: "num", col: "c-pts" },
      { label: "Giuste", cls: "num", col: "c-ok" }, { label: "Sec", cls: "num hide-sm", col: "c-sec" },
    ], leaderboard().map((score, i) => ({
      cls: i < 3 && score.punti ? "podium" : "",
      cells: [i + 1, `${score.emoji} ${score.nome}`.trim(), score.punti, score.giuste, score.secondi.toFixed(1)],
    })), "Nessun giocatore ancora."));
  }

  // ---------- QR / download ----------
  function drawQr() {
    const qr = qrcode(0, "M");
    qr.addData(PLAYER_URL);
    qr.make();
    const count = qr.getModuleCount(), size = 20, margin = 2;
    const canvas = $("qrCanvas");
    canvas.width = canvas.height = (count + margin * 2) * size;
    const context = canvas.getContext("2d");
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "#1C2040";
    for (let r = 0; r < count; r++)
      for (let c = 0; c < count; c++)
        if (qr.isDark(r, c)) context.fillRect((c + margin) * size, (r + margin) * size, size, size);
    $("qrUrl").textContent = PLAYER_URL;
  }

  function download(name, href) {
    const link = Object.assign(document.createElement("a"), { href, download: name });
    document.body.appendChild(link); link.click(); link.remove();
  }

  // ---------- flusso ----------
  function logout(message) {
    key = null;
    store.set("skydo-host-key", "");
    $("game").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginError").textContent = message || "";
  }

  async function enter() {
    $("login").classList.add("hidden");
    $("game").classList.remove("hidden");
    await loadQuiz();
    render();
    poll();
  }

  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
      await post("/login", { key: $("password").value });
      key = $("password").value;
      store.set("skydo-host-key", key);
      enter();
    } catch (error) { $("loginError").textContent = error.status === 403 ? error.message : "Server non raggiungibile, riprova"; }
  };

  $("next").onclick = async () => {
    const next = $("next");
    next.dataset.busy = "1";
    next.disabled = true;
    next.textContent = "…";
    try {
      await post("/question", { key, n: state.n + 1 });
      while (pollBusy) await new Promise((resolve) => setTimeout(resolve, 50));
      await poll();
    } catch (error) { $("gameError").textContent = "Domanda non partita: " + error.message; }
    delete next.dataset.busy;
    render();
  };

  $("reset").onclick = async () => {
    if (!confirm("Azzerare la partita? Risposte e classifica verranno cancellate (scarica prima l'Excel se ti serve).")) return;
    try {
      while (pollBusy) await new Promise((resolve) => setTimeout(resolve, 50));
      pollBusy = true;
      epoch = (await post("/reset", { key })).epoch;
      state = freshState();
      $("gameError").textContent = "";
      await loadQuiz();
    } catch (error) { $("gameError").textContent = "Reset non riuscito: " + error.message; }
    pollBusy = false;
    render();
  };

  // Excel con due fogli: Classifica (com'è ora) e Risposte (tutte, per ricostruire la partita)
  $("xlsx").onclick = () => {
    const sheet = (rows, widths) => Object.assign(XLSX.utils.json_to_sheet(rows), { "!cols": widths.map((wch) => ({ wch })) });
    const board = leaderboard().map((score, i) => ({
      Posizione: i + 1, Emoji: score.emoji, Nickname: score.nome, Punti: score.punti, Giuste: score.giuste, Secondi: Math.round(score.secondi * 10) / 10,
    }));
    const answers = state.answers.map((answer) => ({
      Domanda: answer.domanda, Emoji: (state.players[answer.id] || {}).emoji, Nickname: (state.players[answer.id] || {}).nome, Risposta: optionLabel(answer), Corretta: answer.corretta ? "sì" : "no",
      Primo: answer.primo ? "sì" : "", Secondi: answer.secondi, Punti: answer.punti, Ora: new Date(answer.ts).toLocaleTimeString("it-IT"),
    }));
    const book = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(book, sheet(board, [10, 7, 26, 8, 8, 9]), "Classifica");
    XLSX.utils.book_append_sheet(book, sheet(answers, [9, 7, 26, 32, 9, 6, 9, 7, 10]), "Risposte");
    const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
    XLSX.writeFile(book, `sky_insight_cup_${stamp}.xlsx`);
  };

  $("podium").onclick = () => window.open(new URL("classifica.html", location.href).href, "_blank");
  $("showQr").onclick = () => $("qrModal").classList.remove("hidden");
  $("qrClose").onclick = () => $("qrModal").classList.add("hidden");
  $("qrDownload").onclick = () => download("sky_insight_cup_qr.png", $("qrCanvas").toDataURL("image/png"));

  document.querySelectorAll(".tabs button").forEach((button) => {
    button.onclick = () => {
      document.querySelectorAll(".tabs button").forEach((other) => other.classList.toggle("active", other === button));
      ["live", "board"].forEach((id) => $(id).classList.toggle("hidden", id !== button.dataset.tab));
    };
  });

  // le domande stanno solo sul server (Secret File di Render), lette con la chiave
  async function loadQuiz() {
    try {
      const resp = await fetch(`${SERVER}/quiz?key=${encodeURIComponent(key)}`);
      if (!resp.ok) throw new Error();
      quiz = (await resp.json()).quiz;
      if (!quiz.length) $("gameError").textContent = "Nessuna domanda sul server: carica quiz.json come Secret File su Render";
    } catch { $("gameError").textContent = "Domande non lette dal server, ricarica la pagina"; }
    render();
  }

  (async () => {
    drawQr();
    if (!(await wakeServer())) return;
    if (key) enter(); else logout();
    setInterval(poll, 500);
  })();
</script>
</body>
</html>
